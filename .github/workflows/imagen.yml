# Construye la imagen, la prueba de extremo a extremo y, solo si todo pasa, la publica en ghcr.io
name: Construir, probar y publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"   # cada lunes: reconstruye con parches de seguridad de la imagen base

permissions:
  contents: write           # para crear la «release» en GitHub
  packages: write

env:
  IMAGEN: ghcr.io/${{ github.repository_owner }}/anonimizador

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión (archivo VERSION)
        run: echo "VERSION=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"

      - name: Pruebas unitarias (lógica propia)
        run: |
          pip install -q python-stdnum
          python3 tests/test_basico.py

      - name: Generar documentos ficticios de prueba
        run: |
          sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
          pip install -q reportlab pillow
          python3 tests/generar_fixtures.py

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: anonimizador:prueba
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Arrancar contenedor SIN acceso a Internet y con el mismo endurecimiento que en el NAS
        run: |
          # Red interna: el contenedor no puede salir a Internet. Si la app dependiera de algo
          # externo en ejecución, la prueba siguiente fallaría.
          docker network create --internal sinred
          docker pull -q python:3.12-slim
          docker run -d --name anon --network sinred \
            -e ANON_USER=ci -e ANON_PASSWORD=clave-de-prueba-ci -e IDLE_SECONDS=30 -e GLINER_HILOS=2 \
            --user 10001:10001 --read-only --tmpfs /tmp:size=2g,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 256 --memory 5g --cpus 2 \
            -v anon_datos:/data \
            anonimizador:prueba

      - name: RAM en reposo al arrancar
        run: |
          sleep 15
          docker stats --no-stream --format 'Arranque: {{.MemUsage}}' anon | tee -a ram.txt

      - name: Prueba de extremo a extremo sin Internet (PDF digital es/ca/en + escaneado con OCR)
        run: |
          docker run --rm --network sinred -v "$PWD/tests:/tests:ro" python:3.12-slim \
            python3 /tests/e2e.py http://anon:8010 ci clave-de-prueba-ci

      - name: RAM con los modelos cargados, y tras la inactividad (debe bajar)
        run: |
          docker stats --no-stream --format 'Modelos cargados: {{.MemUsage}}' anon | tee -a ram.txt
          echo "Esperando a que se liberen los modelos por inactividad..."
          sleep 75
          docker logs anon 2>&1 | grep -E "cargado|liberados" || true
          docker stats --no-stream --format 'Tras inactividad: {{.MemUsage}}' anon | tee -a ram.txt
          echo "### Uso de RAM" >> "$GITHUB_STEP_SUMMARY"; sed 's/^/- /' ram.txt >> "$GITHUB_STEP_SUMMARY"
          # Comprobación: tras la inactividad debe quedar por debajo de 1000 MiB
          python3 - <<'PY'
          import re
          ultima = open("ram.txt").read().strip().splitlines()[-1]
          valor, unidad = re.search(r"([\d.]+)\s*([KMG]i?B)", ultima).groups()
          mib = float(valor) * {"KiB": 1/1024, "MiB": 1, "GiB": 1024, "KB": 1/1024, "MB": 1, "GB": 1024}[unidad]
          print(f"RAM tras inactividad: {mib:.0f} MiB")
          assert mib < 1000, "Los modelos no se han liberado"
          PY

      - name: Registro del contenedor si falla
        if: failure()
        run: docker logs anon

      - name: Iniciar sesión en ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen probada
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:${{ env.VERSION }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: Crear la versión en GitHub (si es nueva)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "La versión $VERSION ya existe: solo se ha actualizado su imagen."
            exit 0
          fi
          # Notas: la sección de esta versión en CHANGELOG.md
          awk -v v="## $VERSION" '$0 ~ "^## " {p = (index($0, v) == 1)} p' CHANGELOG.md > notas.md
          printf '\n**Imagen:** `%s:%s`\n' "$IMAGEN" "$VERSION" >> notas.md
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Anonimizador $VERSION" --notes-file notas.md
