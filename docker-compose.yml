# Anonimizador local de documentos — para pegar en UGOS: Docker → Proyecto → Crear
# Cambia TU_USUARIO_GITHUB y la contraseña antes de desplegar.
services:
  anonimizador:
    image: ghcr.io/TU_USUARIO_GITHUB/anonimizador:latest
    container_name: anonimizador
    restart: unless-stopped
    environment:
      ANON_USER: "anon"
      ANON_PASSWORD: "CAMBIA-ESTO-por-una-clave-larga"   # mínimo 12 caracteres, distinta a la del NAS
      RETENTION_DAYS: "7"        # días que se guardan los trabajos y sus tablas de correspondencias
      MAX_MB: "50"
    ports:
      - "8010:8010"              # 8000 = Paperless, 2283 = Immich. NO abrir en el router.
    volumes:
      - anon_datos:/data         # trabajos temporales y listas (volumen Docker, en el SSD)
    # --- Endurecimiento (menor privilegio) ---
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 6g                # 3 modelos de idioma + OCR
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  anon_datos:
