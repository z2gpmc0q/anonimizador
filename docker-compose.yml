# Anonimizador local de documentos — para pegar en UGOS: Docker → Proyecto → Crear
# Antes de desplegar, cambia ANON_PASSWORD.
services:
  anonimizador:
    image: ghcr.io/z2gpmc0q/anonimizador:v1.0.1   # versión fija: para actualizar, cambia el número
    container_name: anonimizador
    restart: unless-stopped
    environment:
      ANON_USER: "anon"
      ANON_PASSWORD: "CAMBIA-ESTO-por-una-clave-larga"   # mínimo 12 caracteres, distinta a la del NAS
      RETENTION_DAYS: "1"        # se borra todo a las 24 h (o al pulsar «Terminar y borrar»)
      MAX_MB: "50"
      IDLE_SECONDS: "900"        # libera los modelos tras 15 min sin uso (0 = nunca)
      GLINER: "1"                # segundo detector de datos personales (0 = desactivado)
    ports:
      - "8010:8010"              # 8000 = Paperless, 2283 = Immich. NO abrir en el router.
    volumes:
      - anon_datos:/data         # trabajos temporales y listas (volumen Docker, en el SSD)
    # --- Endurecimiento (menor privilegio) ---
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 5g                # techo; en reposo usa mucho menos (modelos bajo demanda)
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  anon_datos:
